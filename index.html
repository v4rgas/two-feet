<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Feet — by v4rgas</title>
    <meta name="author" content="Juan Vargas" />
    <meta
      name="description"
      content="Two Feet: a physics skateboard game played with two feet, one set of keys per foot. A game by v4rgas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://twofeet.v4rgas.com/" />
    <meta property="og:site_name" content="Two Feet" />
    <meta property="og:image" content="https://twofeet.v4rgas.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TWO FEET, a game by v4rgas" />
    <link rel="canonical" href="https://twofeet.v4rgas.com/" />
    <meta property="og:title" content="Two Feet — by v4rgas" />
    <meta
      property="og:description"
      content="A physics skateboard game played with two feet: one set of keys per foot."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://twofeet.v4rgas.com/og.png" />
    <meta name="twitter:title" content="Two Feet — by v4rgas" />
    <meta
      name="twitter:description"
      content="A physics skateboard game played with two feet: one set of keys per foot."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/sponsors/v4rgas/penguin.png" />
    <link rel="apple-touch-icon" href="/sponsors/v4rgas/penguin.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Space+Mono&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe0e6;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      /* Boot screen: the credit while Rapier and the textures load, then it fades out. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        opacity: 1;
      }
      #boot.off {
        opacity: 0;
      }
      #boot img {
        width: 96px;
        height: 96px;
        image-rendering: pixelated;
      }
      #boot p {
        margin: 0;
        font-family: "Space Mono", ui-monospace, monospace;
        font-size: 14px;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot" role="status" aria-label="Loading">
      <img src="/sponsors/v4rgas/penguin.png" alt="" width="96" height="96" />
      <p>two feet — a game by v4rgas</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
