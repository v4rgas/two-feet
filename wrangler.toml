# Two Feet on Cloudflare (Workers static assets: the successor of Cloudflare Pages).
# Deploy: `pnpm deploy` (builds, then uploads dist/ with wrangler).
name = "two-feet"
compatibility_date = "2026-09-28"
# Keep the workers.dev address and per-version preview URLs (used by `pnpm deploy:preview`).
workers_dev = true
preview_urls = true

# The game's address (v4rgas.com is a zone on this Cloudflare account; wrangler creates the DNS record).
routes = [{ pattern = "twofeet.v4rgas.com", custom_domain = true }]

[assets]
directory = "./dist"
